name: Run ATI Bot

on:
  workflow_dispatch:

permissions:
  contents: read

# فقط یک اجرای ATI Bot در هر لحظه
concurrency:
  group: ati-bot-single-run
  cancel-in-progress: false

jobs:
  run-bot:
    name: ATI Crypto Bot
    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ATI Bot
        env:
          TABDEAL_API_KEY: ${{ secrets.TABDEAL_API_KEY }}
          TABDEAL_API_SECRET: ${{ secrets.TABDEAL_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIVE_TRADING: "false"
          ORDER_QTY: ${{ secrets.ORDER_QTY }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=========================================="
          echo "       ATI CRYPTO BOT STARTING"
          echo "=========================================="
          echo "Telegram Heartbeat: 5 minutes"
          echo "Continuous Mode: ON"
          echo "Real Orders: DISABLED"
          echo "Single Run Lock: ON"
          echo "=========================================="

          python -u main.py
