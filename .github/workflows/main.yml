name: Run ATI Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python
        run: python --version

      - name: Run bot and show errors
        run: |
          python main.py
          EXIT_CODE=$?
          echo "BOT EXIT CODE: $EXIT_CODE"
          exit $EXIT_CODE
