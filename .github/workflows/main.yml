name: ATI Futures V19

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:

  run-bot:

    runs-on: ubuntu-latest

    timeout-minutes: 4

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ATI Futures V19
        env:

          # Telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Binance Futures
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}

          # Trading
          LIVE_TRADING: "false"

          ORDER_USDT: "2"
          LEVERAGE: "3"

          # Scanner
          MAX_MARKETS: "75"
          KLINES_LIMIT: "100"

          # Risk
          TP_PCT: "0.012"
          SL_PCT: "0.008"

        run: |
          python main.py
