name: Run ATI Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install tabdeal-python==0.4.7

      - name: Check Secrets
        env:
          TABDIL_API_KEY: ${{ secrets.TABDIL_API_KEY }}
          TABDIL_API_SECRET: ${{ secrets.TABDIL_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Checking ATI secrets..."

          if [ -n "$TABDIL_API_KEY" ]; then
            echo "TABDIL_API_KEY: PRESENT"
          else
            echo "TABDIL_API_KEY: MISSING"
            exit 1
          fi

          if [ -n "$TABDIL_API_SECRET" ]; then
            echo "TABDIL_API_SECRET: PRESENT"
          else
            echo "TABDIL_API_SECRET: MISSING"
            exit 1
          fi

          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN: PRESENT"
          else
            echo "TELEGRAM_BOT_TOKEN: MISSING"
            exit 1
          fi

          if [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_CHAT_ID: PRESENT"
          else
            echo "TELEGRAM_CHAT_ID: MISSING"
            exit 1
          fi

      - name: Run ATI Bot
        env:
          TABDIL_API_KEY: ${{ secrets.TABDIL_API_KEY }}
          TABDIL_API_SECRET: ${{ secrets.TABDIL_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Starting ATI Bot..."
          python main.py
