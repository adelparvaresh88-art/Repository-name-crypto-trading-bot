        f"🕐 Candle: "
        f"{candle_time.strftime('%H:%M')} UTC\n"
        f"💰 Entry: ${entry:,.2f}\n"
    )

    if signal == "BUY":

        save_signal(
            signal,
            entry,
            sl,
            tp,
