name: Run ATI Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install tabdeal-python

      - name: Check Secrets
        env:
          TABDEAL_API_KEY: ${{ secrets.TABDEAL_API_KEY }}
          TABDEAL_API_SECRET: ${{ secrets.TABDEAL_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIVE_TRADING: ${{ secrets.LIVE_TRADING }}
          ORDER_QTY: ${{ secrets.ORDER_QTY }}
        run: |
          if [ -z "$TABDEAL_API_KEY" ]; then echo "TABDEAL_API_KEY: MISSING"; else echo "TABDEAL_API_KEY: PRESENT"; fi
          if [ -z "$TABDEAL_API_SECRET" ]; then echo "TABDEAL_API_SECRET: MISSING"; else echo "TABDEAL_API_SECRET: PRESENT"; fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "TELEGRAM_BOT_TOKEN: MISSING"; else echo "TELEGRAM_BOT_TOKEN: PRESENT"; fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then echo "TELEGRAM_CHAT_ID: MISSING"; else echo "TELEGRAM_CHAT_ID: PRESENT"; fi
          echo "LIVE_TRADING: $LIVE_TRADING"
          echo "ORDER_QTY: $ORDER_QTY"

      - name: Run ATI Bot
        env:
          TABDEAL_API_KEY: ${{ secrets.TABDEAL_API_KEY }}
          TABDEAL_API_SECRET: ${{ secrets.TABDEAL_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIVE_TRADING: ${{ secrets.LIVE_TRADING }}
          ORDER_QTY: ${{ secrets.ORDER_QTY }}
        run: |
          python main.py
