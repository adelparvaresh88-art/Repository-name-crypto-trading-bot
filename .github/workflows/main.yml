name: ATI Bot - Single 5 Minute Runner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ATI Bot
        env:
          TABDEAL_API_KEY: ${{ secrets.TABDEAL_API_KEY }}
          TABDEAL_API_SECRET: ${{ secrets.TABDEAL_API_SECRET }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          ORDER_QTY: ${{ secrets.ORDER_QTY }}

          LIVE_TRADING: ${{ secrets.LIVE_TRADING }}
          REAL_TRADING_CONFIRM: ${{ secrets.REAL_TRADING_CONFIRM }}

          PYTHONUNBUFFERED: "1"

        run: |
          echo "========================================"
          echo "ATI BOT START"
          echo "========================================"
          echo "UTC TIME:"
          date -u
          echo "========================================"
          python -u main.py

      - name: Save paper history
        if: always()
        run: |
          if [ -f paper_history.json ]; then
            git config user.name "ATI-bot"
            git config user.email "ati-bot@users.noreply.github.com"

            git add paper_history.json

            if ! git diff --cached --quiet; then
              git commit -m "ATI bot history update"
              git push || true
            fi
          fi
