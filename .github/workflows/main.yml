name: ATI Futures Bot V9.4

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:

  run-bot:

    runs-on: ubuntu-latest

    timeout-minutes: 4

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ATI Futures V9.4
        env:

          TABDEAL_API_KEY: ${{ secrets.TABDEAL_API_KEY }}
          TABDEAL_API_SECRET: ${{ secrets.TABDEAL_API_SECRET }}

          TABDIL_API_KEY: ${{ secrets.TABDIL_API_KEY }}
          TABDIL_API_SECRET: ${{ secrets.TABDIL_API_SECRET }}

          TABDEAL_KEY: ${{ secrets.TABDEAL_KEY }}
          TABDEAL_SECRET: ${{ secrets.TABDEAL_SECRET }}

          TABDIL_KEY: ${{ secrets.TABDIL_KEY }}
          TABDIL_SECRET: ${{ secrets.TABDIL_SECRET }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          REAL_TRADING: "true"

          ORDER_USDT: "2"

          LEVERAGE: "3"

          TP_PCT: "0.02"
          SL_PCT: "0.01"

          SCAN_UNIVERSE: "75"

          MAX_WORKERS: "20"

          REQUEST_TIMEOUT: "8"

          RECV_WINDOW: "5000"

        run: |
          python main.py

      - name: Save persistent 5M state
        if: always()
        run: |

          if [ -f ati_futures_state.json ]; then

            git config user.name "ATI Futures Bot"
            git config user.email "ati-futures-bot@users.noreply.github.com"

            git add ati_futures_state.json

            if ! git diff --cached --quiet; then
              git commit -m "ATI Futures V9.4 state update"
              git push || true
            fi

          fi
