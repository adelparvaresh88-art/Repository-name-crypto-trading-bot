name: ATI Futures Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install official Tabdeal SDK
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install requests websocket-client
          python -m pip install --no-cache-dir git+https://github.com/Tabdeal-Exchange/tabdeal-python.git

      - name: Verify Tabdeal SDK
        run: |
          python -c "import tabdeal; print('Tabdeal SDK import OK')"
          python -c "from tabdeal.future import Future; print('Future import OK')"
          python -c "from tabdeal.enums import OrderSides, OrderTypes; print('Order enums OK')"

      - name: Run ATI Futures
        env:
          BASE_URL: https://api1.tabdeal.org

          ORDER_QTY: "2"
          LEVERAGE: "3"

          LIVE_TRADING: "false"

          TP_PCT: "0.02"
          SL_PCT: "0.01"

          SCAN_UNIVERSE: "75"
          MAX_WORKERS: "12"
          KLINE_LIMIT: "100"
          REQUEST_TIMEOUT: "10"

          TABDEAL_API_KEY: ${{ secrets.TABDEAL_API_KEY }}
          TABDEAL_API_SECRET: ${{ secrets.TABDEAL_API_SECRET }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: python main.py
