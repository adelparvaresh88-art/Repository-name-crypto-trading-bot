name: Run ATI Bot V40.2.43 REAL

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate main.py
        run: python -m py_compile main.py

      - name: Run ATI Bot
        env:
          TABDEAL_API_KEY: ${{ secrets.TABDIL_API_KEY }}
          TABDEAL_API_SECRET: ${{ secrets.TABDIL_API_SECRET }}

          TABDIL_API_KEY: ${{ secrets.TABDIL_API_KEY }}
          TABDIL_API_SECRET: ${{ secrets.TABDIL_API_SECRET }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          LIVE_TRADING: ${{ secrets.LIVE_TRADING }}

          ORDER_USDT: "2"

          RECV_WINDOW: "10000"

        run: python main.py
