name: Run ATI Bot V40.2.15

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: ati-bot-v40-2-15
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    env:
      TABDEAL_API_KEY: ${{ secrets.TABDEAL_API_KEY }}
      TABDEAL_API_SECRET: ${{ secrets.TABDEAL_API_SECRET }}

      TABDIL_API_KEY: ${{ secrets.TABDIL_API_KEY }}
      TABDIL_API_SECRET: ${{ secrets.TABDIL_API_SECRET }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      LIVE_TRADING: ${{ secrets.LIVE_TRADING }}
      ORDER_QTY: ${{ secrets.ORDER_QTY }}

      PYTHONUNBUFFERED: "1"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify Python syntax
        run: |
          python -m py_compile main.py

      - name: Start ATI Bot
        run: |
          echo "=========================================="
          echo "ATI CRYPTO BOT V40.2.15"
          echo "=========================================="
          echo "SERVER TIME AUTH: ENABLED"
          echo "API AUTH CHECK: ENABLED"
          echo "CAN TRADE CHECK: ENABLED"
          echo "USDT BALANCE CHECK: ENABLED"
          echo "REAL BUY MAX PER RUN: 1"
          echo "=========================================="

          python -u main.py
