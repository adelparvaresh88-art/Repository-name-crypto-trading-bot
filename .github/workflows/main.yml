            return True

        if current_price >= sl:

            send_telegram(
                "🔴 ATI RESULT\n\n"
                "📊 SELL SIGNAL\n"
                f"💰 Entry: ${entry:,.2f}\n"
                f"🛑 SL: ${sl:,.2f}\n"
                f"📈 Current: ${current_price:,.2f}\n\n"
                "❌ SL HIT"
            )

            clear_signal()
            return True

    return False


def main():

    print("⚡ ATI CRYPTO BOT - STAGE 7")

    trades = get_trades()

    print(f"📊 Trades received: {len(trades)}")

    if not trades:
        raise Exception("No trades received")

    print("✅ Tabdeal Market API: OK")

    candles = build_candles(trades)

    print(f"🕯 5M candles built: {len(candles)}")

    if len(candles) < 6:
        raise Exception("Not enough 5M candles")

    latest_price = get_trade_price(trades[-1])

    if latest_price is None:
        latest_price = candles[-1][1]["close"]

    # Check previous active signal
    if check_active_signal(latest_price):
