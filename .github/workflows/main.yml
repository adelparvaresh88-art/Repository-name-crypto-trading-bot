import os
import requests
from decimal import Decimal, ROUND_DOWN
from datetime import datetime, timezone

from tabdeal.spot import Spot
from tabdeal.enums import OrderSides, OrderTypes


# =========================
# ATI BOT SETTINGS
# =========================

SYMBOL = "BTCUSDT"

TRADE_USDT = Decimal("2.00")

SL_PERCENT = Decimal("0.50")
TP_PERCENT = Decimal("1.00")

SIGNAL_THRESHOLD = 4

# REAL TRADING
REAL_TRADING = True

BASE_URL = "https://api1.tabdeal.org"

BOT_TOKEN = os.getenv("TELEGRAM_BOT_TOKEN")
CHAT_ID = os.getenv("TELEGRAM_CHAT_ID")

API_KEY = os.getenv("TABDIL_API_KEY")
API_SECRET = os.getenv("TABDIL_API_SECRET")


# =========================
# TELEGRAM
# =========================

def send_telegram(message):

    if not BOT_TOKEN or not CHAT_ID:
        print("❌ Telegram secrets missing")
        return False

    url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"

    try:
        response = requests.post(
            url,
            data={
                "chat_id": CHAT_ID,
                "text": message
            },
            timeout=20
        )

        print("Telegram:", response.status_code)

        return response.ok

    except Exception as e:
        print("Telegram error:", e)
        return False


# =========================
# TABDEAL CLIENT
# =========================

def get_client():

    if not API_KEY or not API_SECRET:
        raise RuntimeError(
            "TABDIL_API_KEY or TABDIL_API_SECRET is missing"
        )

    return Spot(
        API_KEY,
        API_SECRET,
        base_url=BASE_URL,
        version="v1",
        timeout=20,
        receive_window=5000
    )


# =========================
# ACCOUNT
# =========================

def get_account(client):

    account = client.account()

    print("✅ Account API OK")

    return account


def get_free_balance(account, asset):

    balances = account.get("balances", [])

    for balance in balances:

        if balance.get("asset") == asset:

            return Decimal(
                str(
                    balance.get(
                        "free",
                        balance.get("available", "0")
                    )
                )
            )

    return Decimal("0")


# =========================
# OPEN ORDERS
# =========================

def get_open_orders(client):

    try:
        orders = client.get_open_orders(
            symbol=SYMBOL
        )

        if orders is None:
            return []

        return orders

    except Exception as e:

        print("Open orders check error:", e)

        raise


def get_open_oco_orders(client):

    try:

        orders = client.get_open_oco_orders()

        if orders is None:
            return []

        return orders

    except Exception as e:

        print("OCO check error:", e)

        raise


# =========================
# MARKET DATA
# =========================

def get_trades(client):

    trades = client.trades(
        symbol=SYMBOL,
        limit=1000
    )

    if isinstance(trades, dict):

        for key in ["data", "result", "trades"]:

            if key in trades:

                trades = trades[key]
                break

    if not isinstance(trades, list):

        raise ValueError(
            f"Unexpected trades response: {trades}"
        )

    print(f"✅ Trades received: {len(trades)}")

    return trades


# =========================
# BUILD 5M CANDLES
# =========================

def build_5m_candles(trades):

    candles = {}

    for trade in trades:

        try:

            price = Decimal(
                str(trade.get("price"))
            )

            quantity = Decimal(
                str(
                    trade.get(
                        "qty",
                        trade.get("quantity", "0")
                    )
                )
            )

            timestamp = int(
                trade.get(
                    "time",
                    trade.get("timestamp")
                )
            )

            bucket = timestamp - (
                timestamp % (5 * 60 * 1000)
            )

            if bucket not in candles:

                candles[bucket] = {

                    "time": bucket,

                    "open": price,

                    "high": price,

                    "low": price,

                    "close": price,

                    "volume": quantity
                }

            else:

                candle = candles[bucket]

                candle["high"] = max(
                    candle["high"],
                    price
                )

                candle["low"] = min(
                    candle["low"],
                    price
                )

                candle["close"] = price

                candle["volume"] += quantity

        except Exception as e:

            print(
                "Trade parsing error:",
                e
            )

    result = list(candles.values())

    result.sort(
        key=lambda x: x["time"]
    )

    print(
        f"🕯 5M candles built: {len(result)}"
    )

    return result


# =========================
# CLOSED CANDLES
# =========================

def get_closed_candles(candles):

    if len(candles) < 6:

        return []

    now_ms = int(
        datetime.now(
            timezone.utc
        ).timestamp() * 1000
    )

    current_bucket = now_ms - (
        now_ms % (5 * 60 * 1000)
    )

    closed = [

        candle

        for candle in candles

        if candle["time"] < current_bucket
    ]

    print(
        f"✅ Closed candles: {len(closed)}"
    )

    return closed


# =========================
# STAGE 8 SIGNAL
# =========================

def calculate_signal(candles):

    if len(candles) < 6:

        return None

    c1 = candles[-1]
    c2 = candles[-2]
    c3 = candles[-3]
    c4 = candles[-4]
    c5 = candles[-5]

    buy_score = 0
    sell_score = 0

    # 1. PRICE DIRECTION

    if c1["close"] > c2["close"]:

        buy_score += 1

    elif c1["close"] < c2["close"]:

        sell_score += 1


    # 2. MARKET STRUCTURE

    if (
        c1["high"] > c2["high"]
        and
        c1["low"] > c2["low"]
    ):

        buy_score += 1

    elif (
        c1["high"] < c2["high"]
        and
        c1["low"] < c2["low"]
    ):

        sell_score += 1


    # 3. CANDLE STRENGTH

    body = c1["close"] - c1["open"]

    candle_range = (
        c1["high"] - c1["low"]
    )

    if candle_range > 0:

        body_ratio = (
            abs(body) / candle_range
        )

        if (
            body > 0
            and
            body_ratio >= Decimal("0.45")
        ):

            buy_score += 1

        elif (
            body < 0
            and
            body_ratio >= Decimal("0.45")
        ):

            sell_score += 1


    # 4. MOMENTUM

    previous_move = (
        c2["close"] - c3["close"]
    )

    current_move = (
        c1["close"] - c2["close"]
    )

    if (
        current_move > 0
        and
        previous_move > 0
    ):

        buy_score += 1

    elif (
        current_move < 0
        and
        previous_move < 0
    ):

        sell_score += 1


    # 5. BREAKOUT

    previous_high = max(
        c2["high"],
        c3["high"],
        c4["high"],
        c5["high"]
    )

    previous_low = min(
        c2["low"],
        c3["low"],
        c4["low"],
        c5["low"]
    )

    if c1["close"] > previous_high:

        buy_score += 1

    elif c1["close"] < previous_low:

        sell_score += 1


    # FINAL SIGNAL

    if (
        buy_score >= SIGNAL_THRESHOLD
        and
        buy_score > sell_score
    ):

        signal = "BUY"

    elif (
        sell_score >= SIGNAL_THRESHOLD
        and
        sell_score > buy_score
    ):

        signal = "SELL"

    else:

        signal = "NO SIGNAL"


    return {

        "signal": signal,

        "buy_score": buy_score,

        "sell_score": sell_score,

        "candle": c1
    }


# =========================
# DUPLICATE PROTECTION
# =========================

def trading_state(client):

    open_orders = get_open_orders(client)

    if open_orders:

        print("🛑 Open normal order exists")

        return True


    open_oco = get_open_oco_orders(client)

    if open_oco:

        print("🛑 Open OCO exists")

        return True


    account = get_account(client)

    btc_balance = get_free_balance(
        account,
        "BTC"
    )

    print(
        f"₿ Free BTC balance: {btc_balance}"
    )

    if btc_balance > Decimal("0.000001"):

        print(
            "🛑 Existing BTC balance detected"
        )

        return True


    return False


# =========================
# CALCULATE BTC QUANTITY
# =========================

def calculate_quantity(price):

    quantity = (
        TRADE_USDT / price
    )

    quantity = quantity.quantize(
        Decimal("0.000001"),
        rounding=ROUND_DOWN
    )

    return quantity


# =========================
# REAL BUY
# =========================

def place_buy(client, quantity):

    client_order_id = (
        "ATI_"
        + datetime.now(
            timezone.utc
        ).strftime("%Y%m%d%H%M%S")
    )

    print(
        f"🟢 Sending REAL BUY: {quantity} BTC"
    )

    order = client.new_order(

        symbol=SYMBOL,

        side=OrderSides.BUY,

        type=OrderTypes.MARKET,

        quantity=str(quantity),

        client_order_id=client_order_id
    )

    print("✅ REAL BUY SENT")

    return order


# =========================
# OCO PROTECTION
# =========================

def place_oco(
    client,
    quantity,
    entry
):

    tp = (
        entry
        *
        (
            Decimal("1")
            +
            TP_PERCENT / Decimal("100")
        )
    )

    sl = (
        entry
        *
        (
            Decimal("1")
            -
            SL_PERCENT / Decimal("100")
        )
    )

    stop_limit = (
        sl
        *
        Decimal("0.999")
    )

    tp = tp.quantize(
        Decimal("0.01"),
        rounding=ROUND_DOWN
    )

    sl = sl.quantize(
        Decimal("0.01"),
        rounding=ROUND_DOWN
    )

    stop_limit = stop_limit.quantize(
        Decimal("0.01"),
        rounding=ROUND_DOWN
    )

    print(
        f"🎯 TP: {tp}"
    )

    print(
        f"🛑 SL: {sl}"
    )

    print(
        f"🛑 Stop Limit: {stop_limit}"
    )

    list_client_order_id = (
        "ATI_OCO_"
        +
        datetime.now(
            timezone.utc
        ).strftime("%Y%m%d%H%M%S")
    )

    oco = client.new_oco_order(

        symbol=SYMBOL,

        side=OrderSides.SELL,

        quantity=str(quantity),

        price=str(tp),

        stop_price=str(sl),

        stop_limit_price=str(
            stop_limit
        ),

        list_client_order_id=
        list_client_order_id
    )

    print("✅ OCO PROTECTION SENT")

    return oco


# =========================
# TELEGRAM MESSAGE
# =========================

def build_message(result):

    candle = result["candle"]

    signal = result["signal"]

    entry = candle["close"]

    buy_score = result["buy_score"]

    sell_score = result["sell_score"]

    candle_time = datetime.fromtimestamp(

        candle["time"] / 1000,

        tz=timezone.utc

    ).strftime("%H:%M UTC")


    message = (

        "⚡ ATI CRYPTO BOT - STAGE 8\n\n"

        "₿ BTC/USDT\n"

        "⏱ Timeframe: 5m\n"

        "✅ CLOSED CANDLE\n"

        "💪 STRONG SIGNAL FILTER\n\n"

        f"📊 SIGNAL: {signal}\n"

        f"📈 BUY SCORE: {buy_score}/5\n"

        f"📉 SELL SCORE: {sell_score}/5\n\n"

        f"🕐 Candle: {candle_time}\n"

        f"💰 Entry: ${entry:,.2f}\n"
    )


    if signal == "BUY":

        sl = (
            entry
            *
            (
                Decimal("1")
                -
                SL_PERCENT / Decimal("100")
            )
        )

        tp = (
            entry
            *
            (
                Decimal("1")
                +
                TP_PERCENT / Decimal("100")
            )
        )

        message += (

            "\n🟢 BUY SIGNAL\n"

            f"🛑 SL: ${sl:,.2f}\n"

            f"🎯 TP: ${tp:,.2f}\n\n"

            "💵 REAL TRADING\n"

            "💰 Trade Size: 2 USDT\n"

            "🛡 OCO PROTECTION ACTIVE"
        )


    elif signal == "SELL":

        message += (

            "\n🔴 SELL SIGNAL\n\n"

            "ℹ️ SELL signal detected.\n"

            "🛡 Bot will NOT sell unknown BTC holdings."
        )


    else:

        message += (

            "\n⏳ NO STRONG SIGNAL\n\n"

            "💵 REAL TRADING ENABLED"
        )


    return message


# =========================
# MAIN
# =========================

def main():

    print(
        "================================"
    )

    print(
        "⚡ ATI CRYPTO BOT - STAGE 8"
    )

    print(
        "💵 REAL TRADING MODE"
    )

    print(
        "================================"
    )


    try:

        # CONNECT

        client = get_client()

        print(
            "✅ Tabdeal client created"
        )


        # ACCOUNT TEST

        account = get_account(
            client
        )

        usdt_balance = get_free_balance(
            account,
            "USDT"
        )

        print(
            f"💵 USDT Balance: {usdt_balance}"
        )


        # BALANCE CHECK

        if usdt_balance < TRADE_USDT:

            raise RuntimeError(

                f"Not enough USDT. "
                f"Required: {TRADE_USDT}, "
                f"Available: {usdt_balance}"
            )


        # MARKET DATA

        trades = get_trades(
            client
        )

        candles = build_5m_candles(
            trades
        )

        closed = get_closed_candles(
            candles
        )


        if len(closed) < 6:

            send_telegram(

                "⚠️ ATI BOT\n\n"

                "Not enough closed "
                "5M candles."
            )

            return


        # SIGNAL

        result = calculate_signal(
            closed
        )

        if not result:

            raise RuntimeError(
                "Signal calculation failed"
            )


        signal = result["signal"]

        entry = result["candle"]["close"]


        print(
            f"📊 SIGNAL: {signal}"
        )

        print(
            f"📈 BUY SCORE: "
            f"{result['buy_score']}/5"
        )

        print(
            f"📉 SELL SCORE: "
            f"{result['sell_score']}/5"
        )


        # TELEGRAM SIGNAL

        send_telegram(
            build_message(result)
        )


        # NO BUY

        if signal != "BUY":

            print(
                "⏳ No new BUY order."
            )

            return


        # DUPLICATE PROTECTION

        if trading_state(client):

            message = (

                "🛡 ATI SAFETY\n\n"

                "BUY signal detected, "
                "but an existing order/"
                "BTC position was found.\n\n"

                "🚫 New BUY skipped."
            )

            print(message)

            send_telegram(message)

            return


        # QUANTITY

        quantity = calculate_quantity(
            entry
        )

        if quantity <= 0:

            raise RuntimeError(
                "Calculated BTC quantity is zero"
            )


        print(
            f"📦 BUY quantity: {quantity} BTC"
        )


        # REAL BUY

        buy_order = place_buy(

            client,
            quantity
        )


        # REAL OCO

        try:

            place_oco(

                client,

                quantity,

                entry
            )

        except Exception as oco_error:

            critical = (

                "🚨 CRITICAL ATI ERROR\n\n"

                "REAL BUY was sent,\n"

                "but OCO protection "
                "could NOT be created.\n\n"

                f"Error: {oco_error}\n\n"

                "⚠️ CHECK TABDEAL "
                "IMMEDIATELY."
            )

            print(critical)

            send_telegram(
                critical
            )

            return


        # SUCCESS

        success = (

            "🚀 ATI REAL TRADE\n\n"

            "🟢 BUY EXECUTED\n"

            f"₿ BTC/USDT\n"

            f"💰 Entry: "
            f"${entry:,.2f}\n"

            f"💵 Size: "
            f"{TRADE_USDT} USDT\n"

            f"📦 Quantity: "
            f"{quantity} BTC\n\n"

            f"🛑 SL: "
            f"${(entry * (Decimal('1') - SL_PERCENT / Decimal('100'))):,.2f}\n"

            f"🎯 TP: "
            f"${(entry * (Decimal('1') + TP_PERCENT / Decimal('100'))):,.2f}\n\n"

            "🛡 OCO PROTECTION: ACTIVE\n"

            "💵 REAL TRADING: ON"
        )

        print(success)

        send_telegram(
            success
        )


    except Exception as e:

        error_message = (

            "🚨 ATI REAL BOT ERROR\n\n"

            f"{type(e).__name__}: {e}\n\n"

            "🛡 NO FURTHER ORDER SENT"
        )

        print(error_message)

        send_telegram(
            error_message
        )


if __name__ == "__main__":

    main()
