name: Run ATI Futures Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  run-bot:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ATI Futures
        env:
          TABDIL_API_KEY: ${{ secrets.TABDIL_API_KEY }}
          TABDIL_API_SECRET: ${{ secrets.TABDIL_API_SECRET }}

          TABDEAL_API_KEY: ${{ secrets.TABDEAL_API_KEY }}
          TABDEAL_API_SECRET: ${{ secrets.TABDEAL_API_SECRET }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          LIVE_TRADING: ${{ secrets.LIVE_TRADING }}

          ORDER_QTY: "2"
          LEVERAGE: "3"

          SL_PERCENT: "1"
          TP_PERCENT: "2"

          TIMEFRAME: "5m"
          KLINE_LIMIT: "100"
          SCAN_WORKERS: "12"
          MIN_SIGNAL_SCORE: "5"
          MAX_KIJUN_DISTANCE: "2.5"

          SCAN_INTERVAL_SECONDS: "300"

        run: |
          python main.py
