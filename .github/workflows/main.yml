name: Run ATI Bot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check Secrets
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN missing"
            exit 1
          else
            echo "✅ TELEGRAM_BOT_TOKEN present"
          fi

          if [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "❌ TELEGRAM_CHAT_ID missing"
            exit 1
          else
            echo "✅ TELEGRAM_CHAT_ID present"
          fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Run ATI Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Save signal file
        if: always()
        run: |
          git config user.name "ATI Bot"
          git config user.email "ati-bot@users.noreply.github.com"

          if [ -f active_signal.json ]; then
            git add active_signal.json

            if ! git diff --cached --quiet; then
              git commit -m "Update ATI active signal"
              git push
            else
              echo "No signal changes to save"
            fi
          else
            echo "No active_signal.json found"
          fi
