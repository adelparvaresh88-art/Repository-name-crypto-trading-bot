name: Run ATI Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: ati-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    timeout-minutes: 6

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check Python syntax
        run: |
          python -m py_compile main.py

      - name: Run ATI Bot
        env:
          TABDEAL_API_KEY: ${{ secrets.TABDEAL_API_KEY }}
          TABDEAL_API_SECRET: ${{ secrets.TABDEAL_API_SECRET }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          ORDER_QTY: ${{ secrets.ORDER_QTY }}

          LIVE_TRADING: ${{ secrets.LIVE_TRADING }}
          REAL_TRADING_CONFIRM: ${{ secrets.REAL_TRADING_CONFIRM }}

        run: |
          echo "========================================"
          echo "ATI BOT START"
          echo "========================================"
          echo "UTC TIME:"
          date -u
          echo "========================================"

          python main.py

          echo "========================================"
          echo "ATI BOT FINISHED"
          echo "========================================"
